apiVersion: apps/v1
kind: Deployment
metadata:
  name: trading-backend
  namespace: trading-sandbox
spec:
  replicas: 1
  selector:
    matchLabels:
      app: trading-platform
      component: backend
  template:
    metadata:
      labels:
        app: trading-platform
        component: backend
    spec:
      serviceAccountName: trading-backend
      containers:
      - name: backend
        image: trading-platform/backend:latest
        imagePullPolicy: IfNotPresent
        workingDir: /app
        command:
        - ./trading-backend
        ports:
        - containerPort: 3000
          name: api
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        env:
        - name: PORT
          value: "3000"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: trading-backend
  namespace: trading-sandbox
spec:
  selector:
    app: trading-platform
    component: backend
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: api
  type: LoadBalancer
